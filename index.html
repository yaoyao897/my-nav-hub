<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuanjie's Hub · 个人专属网络收藏与导航台</title>
  <meta name="description" content="袁杰的个人专属网络收藏导航台，涵盖工业数字化系统、AI大模型、知识研读与生产力工具。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      
      /* Dark Theme (Default) */
      --bg-base: #0a0d14;
      --bg-surface: rgba(18, 24, 38, 0.7);
      --bg-surface-hover: rgba(28, 38, 58, 0.85);
      --bg-card: rgba(16, 22, 34, 0.75);
      --bg-card-hover: rgba(24, 33, 52, 0.9);
      --bg-input: rgba(12, 17, 28, 0.8);
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #3b82f6;
      --border-highlight: rgba(255, 255, 255, 0.15);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      
      --accent-primary: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-purple: #8b5cf6;
      
      --glow-cyan: rgba(6, 182, 212, 0.22);
      --glow-blue: rgba(59, 130, 246, 0.22);
      --glow-purple: rgba(139, 92, 246, 0.22);
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 16px 40px -8px rgba(0, 0, 0, 0.5);
      --card-radius: 14px;
    }

    [data-theme="light"] {
      --bg-base: #f1f5f9;
      --bg-surface: rgba(255, 255, 255, 0.85);
      --bg-surface-hover: rgba(255, 255, 255, 0.98);
      --bg-card: rgba(255, 255, 255, 0.9);
      --bg-card-hover: #ffffff;
      --bg-input: rgba(241, 245, 249, 0.9);
      
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-focus: #2563eb;
      --border-highlight: rgba(0, 0, 0, 0.12);
      
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      
      --accent-primary: #2563eb;
      --accent-cyan: #0891b2;
      --accent-emerald: #059669;
      --accent-amber: #d97706;
      --accent-rose: #e11d48;
      --accent-purple: #7c3aed;
      
      --glow-cyan: rgba(8, 145, 178, 0.12);
      --glow-blue: rgba(37, 99, 235, 0.12);
      --glow-purple: rgba(124, 58, 237, 0.12);
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 16px 36px -8px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      transition: background-color 0.3s ease, color 0.3s ease;
      background-image: 
        radial-gradient(circle at 12% 8%, var(--glow-blue) 0%, transparent 40%),
        radial-gradient(circle at 88% 20%, var(--glow-purple) 0%, transparent 35%),
        radial-gradient(circle at 50% 80%, var(--glow-cyan) 0%, transparent 45%);
      background-attachment: fixed;
    }

    /* Top Navigation Header */
    header.hub-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.85rem 1.5rem;
      transition: all 0.3s ease;
    }

    .header-container {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
    }

    .brand-title-wrap h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-primary);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-tertiary);
    }

    /* Search & Filter bar */
    .search-bar-wrap {
      flex: 1;
      max-width: 520px;
      min-width: 260px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.6rem;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-input);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-tertiary);
      pointer-events: none;
    }

    .search-shortcut {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem;
      color: var(--text-tertiary);
      background: rgba(255, 255, 255, 0.06);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-highlight);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
      color: #fff;
      border: none;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.5);
      transform: translateY(-1px);
      color: #fff;
    }

    /* Main Container */
    main.hub-content {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* Stats Overview Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius);
      padding: 1rem 1.25rem;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .stat-card:hover, .stat-card.active {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      background: rgba(255, 255, 255, 0.05);
    }

    .stat-info .stat-num {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .stat-info .stat-label {
      font-size: 0.78rem;
      color: var(--text-tertiary);
    }

    /* Quick Filter Tabs */
    .filter-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .category-pills {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pill-tab {
      padding: 0.45rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .pill-tab:hover {
      color: var(--text-primary);
      border-color: var(--border-highlight);
    }

    .pill-tab.active {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

    .pill-tab .count {
      font-size: 0.72rem;
      padding: 0.1rem 0.4rem;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.2);
    }

    .view-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .view-btn {
      padding: 0.45rem 0.65rem;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.2s;
    }

    .view-btn.active {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
    }

    /* Space Section */
    .space-group {
      margin-bottom: 2.5rem;
    }

    .space-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .space-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .space-tag {
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-tertiary);
    }

    /* List Sub-section */
    .list-section {
      margin-bottom: 1.8rem;
    }

    .list-header {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .list-header::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 14px;
      border-radius: 2px;
      background: var(--accent-cyan);
    }

    /* Bookmarks Grid View */
    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.1rem;
    }

    .bookmark-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius);
      padding: 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .bookmark-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--border-focus), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .bookmark-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
      box-shadow: var(--shadow-md);
      transform: translateY(-3px);
    }

    .bookmark-card:hover::after {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
    }

    .card-favicon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-cyan);
    }

    .card-favicon img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .card-main {
      flex: 1;
      min-width: 0;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      word-break: break-word;
      transition: color 0.15s;
    }

    .card-title:hover {
      color: var(--accent-primary);
    }

    .env-tag {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.12rem 0.45rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .env-lan {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .env-ext {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .env-saas {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-primary);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .env-prod {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-rose);
      border: 1px solid rgba(244, 63, 94, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .env-prod::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-rose);
      box-shadow: 0 0 6px var(--accent-rose);
    }

    .card-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.4rem;
    }

    .card-url-mono {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-tertiary);
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.6rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.75rem;
      color: var(--text-tertiary);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .icon-action-btn {
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .icon-action-btn:hover {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
    }

    /* Table View Styles */
    .bookmarks-table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius);
      overflow-x: auto;
      margin-bottom: 2rem;
    }

    table.bookmarks-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    table.bookmarks-table th {
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-tertiary);
      font-weight: 600;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    table.bookmarks-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      vertical-align: middle;
    }

    table.bookmarks-table tr:hover td {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
    }

    table.bookmarks-table td.title-col {
      font-weight: 600;
      color: var(--text-primary);
    }

    table.bookmarks-table td.url-col {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 100;
      background: #1e293b;
      color: #f8fafc;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: var(--shadow-lg);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        align-items: stretch;
      }
      .search-bar-wrap {
        max-width: 100%;
      }
      .bookmarks-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="hub-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-avatar">Y</div>
        <div class="brand-title-wrap">
          <h1>Yuanjie's Hub <span class="brand-badge">专属收藏</span></h1>
          <div class="brand-subtitle">个人数字化工作台 · Toby 极速网络导航</div>
        </div>
      </div>

      <div class="search-bar-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索系统名称、IP/域名、备注、分组... (Cmd+K)">
        <span class="search-shortcut">⌘K</span>
      </div>

      <div class="header-actions">
        <button id="copyAllBtn" class="btn" title="复制所有书签链接">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          复制全部
        </button>
        <button id="exportHtmlBtn" class="btn btn-primary" title="导出为标准浏览器书签 HTML">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          导出书签
        </button>
        <button id="themeToggleBtn" class="btn" title="切换浅色/深色主题">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main class="hub-content">
    <!-- Quick Statistics Overview -->
    <section class="stats-bar">
      <div class="stat-card active" data-filter="all">
        <div class="stat-icon">📑</div>
        <div class="stat-info">
          <div class="stat-num" id="countAll">59</div>

        `;

        for (const item of filtered) {
          let envBadge = '';
          if (item.isProd) {
            envBadge = '<span class="env-tag env-prod">生产库</span>';
          } else if (item.env === 'lan') {
            envBadge = '<span class="env-tag env-lan">内网 192.168</span>';
          } else if (item.env === 'ext-ip') {
            envBadge = '<span class="env-tag env-ext">外部服务器</span>';
          } else {
            envBadge = '<span class="env-tag env-saas">SaaS/云端</span>';
          }

          html += `
            <tr>
              <td class="title-col">
                <a href="${item.url}" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none;">
                  ${item.displayName}
                </a>
              </td>
              <td>${envBadge}</td>
              <td>${item.spaceName} / ${item.listTitle}</td>
              <td class="url-col" title="${item.url}">${item.url}</td>
              <td>
                <div style="display: flex; gap: 0.3rem;">
                  <button class="icon-action-btn copy-btn" data-url="${item.url}">复制</button>
                  <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="icon-action-btn">直达</a>
                </div>
              </td>
            </tr>
          `;
        }

        html += `
              </tbody>
            </table>
          </div>
        `;
      }

      container.innerHTML = html;

      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const url = btn.getAttribute('data-url');
          navigator.clipboard.writeText(url).then(() => {
            showToast('已复制：' + url);
          });
        });
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.add('show');
      setTimeout(() => {
        t.classList.remove('show');
      }, 2400);
    }

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value.trim();
      render();
    });

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        searchInput.focus();
      }
    });

    document.querySelectorAll('.pill-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.pill-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.getAttribute('data-category');
        render();
      });
    });

    document.querySelectorAll('.stat-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        const filter = card.getAttribute('data-filter');
        if (filter === 'all') {
          currentCategory = 'all';
          currentEnvFilter = 'all';
        } else if (filter === 'space-wanwu') {
          currentCategory = '万物智汇';
          currentEnvFilter = 'all';
        } else if (filter === 'category-ai') {
          currentCategory = 'AI TOOL';
          currentEnvFilter = 'all';
        } else if (filter === 'env-lan') {
          currentCategory = 'all';
          currentEnvFilter = 'lan';
        } else if (filter === 'env-prod') {
          currentCategory = 'all';
          currentEnvFilter = 'prod';
        }

        document.querySelectorAll('.pill-tab').forEach(t => {
          t.classList.toggle('active', t.getAttribute('data-category') === currentCategory);
        });

        render();
      });
    });

    document.getElementById('viewGridBtn').addEventListener('click', () => {
      currentView = 'grid';
      document.getElementById('viewGridBtn').classList.add('active');
      document.getElementById('viewTableBtn').classList.remove('active');
      render();
    });

    document.getElementById('viewTableBtn').addEventListener('click', () => {
      currentView = 'table';
      document.getElementById('viewTableBtn').classList.add('active');
      document.getElementById('viewGridBtn').classList.remove('active');
      render();
    });

    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    themeBtn.addEventListener('click', () => {
      const htmlEl = document.documentElement;
      const isDark = htmlEl.getAttribute('data-theme') === 'dark';
      htmlEl.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeIcon.innerText = isDark ? '☀️' : '🌙';
    });

    document.getElementById('copyAllBtn').addEventListener('click', () => {
      const allUrls = RAW_BOOKMARKS.map(b => `${b.displayName}: ${b.url}`).join('\n');
      navigator.clipboard.writeText(allUrls).then(() => {
        showToast(`已复制全部 ${RAW_BOOKMARKS.length} 个书签链接到剪贴板！`);
      });
    });

    document.getElementById('exportHtmlBtn').addEventListener('click', () => {
      let netscape = '<!DOCTYPE NETSCAPE-Bookmark-file-1>\n';
      netscape += '<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n';
      netscape += '<TITLE>Bookmarks</TITLE>\n';
      netscape += '<H1>Bookmarks</H1>\n<DL><p>\n';

      const spaces = new Map();
      RAW_BOOKMARKS.forEach(b => {
        if (!spaces.has(b.spaceName)) spaces.set(b.spaceName, new Map());
        const lists = spaces.get(b.spaceName);
        if (!lists.has(b.listTitle)) lists.set(b.listTitle, []);
        lists.get(b.listTitle).push(b);
      });

      for (const [sName, lists] of spaces.entries()) {
        netscape += `  <DT><H3>${sName}</H3>\n  <DL><p>\n`;
        for (const [lTitle, items] of lists.entries()) {
          netscape += `    <DT><H3>${lTitle}</H3>\n    <DL><p>\n`;
          for (const item of items) {
            netscape += `      <DT><A HREF="${item.url}">${item.displayName}</A>\n`;
          }
          netscape += `    </DL><p>\n`;
        }
        netscape += `  </DL><p>\n`;
      }
      netscape += '</DL><p>\n';

      const blob = new Blob([netscape], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Yuanjie_Bookmarks_Toby_Export.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('已导出标准浏览器书签 HTML 文件！');
    });

    render();
  </script>
</body>
</html>
